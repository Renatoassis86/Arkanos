<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 864" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1e" />
      <stop offset="50%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>
    
    <!-- Gold Gradient for lines and highlights -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6f27" />
      <stop offset="30%" stop-color="#d4af37" />
      <stop offset="50%" stop-color="#f9e8a2" />
      <stop offset="70%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa8c32" />
    </linearGradient>

    <!-- Blue Glow Gradient -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0d1b3e" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#080e1e" stop-opacity="0" />
    </radialGradient>
    
    <!-- Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1536" height="864" fill="url(#bgGrad)" />
  
  <!-- Center Glow -->
  <circle cx="768" cy="432" r="600" fill="url(#centerGlow)" />
  
  <!-- Elegant Corner Patterns & Borders -->
  <rect x="40" y="40" width="1456" height="784" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.4" />
  <rect x="52" y="52" width="1432" height="760" rx="10" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.2" />
  
  <!-- Corner Ornamental details -->
  <!-- Top Left -->
  <path d="M 40,90 L 90,40 M 40,110 L 110,40 M 40,60 L 60,40" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <!-- Top Right -->
  <path d="M 1496,90 L 1446,40 M 1496,110 L 1426,40 M 1496,60 L 1476,40" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <!-- Bottom Left -->
  <path d="M 40,774 L 90,824 M 40,754 L 110,824 M 40,804 L 60,824" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" fill="none" />
  <!-- Bottom Right -->
  <path d="M 1496,774 L 1446,824 M 1496,754 L 1426,824 M 1496,804 L 1476,824" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.6" fill="none" />
  
  <!-- Concentric Golden Circles -->
  <circle cx="768" cy="432" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="10 5" stroke-opacity="0.5" />
  <circle cx="768" cy="432" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#goldGlow)" />

  <!-- Trojan Horse Silhouette -->
  <g transform="translate(600, 270)" filter="url(#goldGlow)">
    <!-- Base Platform -->
    <rect x="40" y="270" width="260" height="20" rx="5" fill="url(#goldGrad)" />
    <!-- Wheels -->
    <circle cx="80" cy="295" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="80" cy="295" r="4" fill="url(#goldGrad)" />
    <circle cx="160" cy="295" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="160" cy="295" r="4" fill="url(#goldGrad)" />
    <circle cx="240" cy="295" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="240" cy="295" r="4" fill="url(#goldGrad)" />
    
    <!-- Horse Body (geometric, wooden look) -->
    <path d="M 90,210 L 230,210 L 250,150 L 210,130 L 110,130 L 80,160 Z" fill="url(#goldGrad)" />
    <!-- Horse Neck and Head -->
    <path d="M 90,140 L 70,60 C 70,50 60,40 50,45 C 40,50 45,65 50,70 L 70,130 Z" fill="url(#goldGrad)" />
    <!-- Muzzle / Ears -->
    <path d="M 50,45 L 35,48 L 40,58 L 52,55 Z" fill="url(#goldGrad)" />
    <path d="M 68,58 L 65,35 L 75,40 Z" fill="url(#goldGrad)" />
    
    <!-- Legs (thick wooden planks) -->
    <!-- Front Leg 1 -->
    <rect x="85" y="210" width="22" height="60" fill="url(#goldGrad)" />
    <!-- Front Leg 2 -->
    <rect x="115" y="210" width="18" height="60" fill="url(#goldGrad)" opacity="0.7" />
    <!-- Back Leg 1 -->
    <rect x="205" y="210" width="22" height="60" fill="url(#goldGrad)" />
    <!-- Back Leg 2 -->
    <rect x="235" y="210" width="18" height="60" fill="url(#goldGrad)" opacity="0.7" />
    
    <!-- Tail (wooden/rope look) -->
    <path d="M 245,155 L 275,230 L 265,235 L 240,170 Z" fill="url(#goldGrad)" />
    
    <!-- Details (plank lines) -->
    <line x1="120" y1="130" x2="105" y2="210" stroke="#0b172a" stroke-width="2" />
    <line x1="160" y1="130" x2="155" y2="210" stroke="#0b172a" stroke-width="2" />
    <line x1="200" y1="130" x2="205" y2="210" stroke="#0b172a" stroke-width="2" />
  </g>
</svg>
