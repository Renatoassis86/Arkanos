{# parts/header.html #}
{% load static %}
<div id="ark-header-wrapper">
  <header id="ark-site-header"
    class="{% if request.path == '/' or request.path == '' %}header-home{% else %}header-solid{% endif %}">
    <!-- MAIN NAV BAR -->
    <div class="main-bar">
      <div class="container main-bar-inner">

        <!-- LOGO AREA -->
        <div class="logo-area">
          <a href="{% url 'arkanos:home' %}" class="logo-link">
            <img src="{% static 'img/icones/logo.png' %}" alt="Arkanos" class="logo-img">
          </a>
        </div>

        <!-- TOGGLE BTN (Mobile) -->
        <button id="ark-mobile-toggle" aria-label="Menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- NAVIGATION LINKS -->
        <nav id="ark-main-nav">
          <div class="nav-list">
            <a href="/#programas">Programas</a>
            <a href="/#conteudos">Conteúdos</a>

            <a href="{% url 'arkanos:jogos' %}">Desafios</a>

            <a href="/#guardioes">Guardiões</a>
            <a href="{% url 'ark:home' %}">Ark</a>
            <a href="{% url 'arkanos:fale_conosco' %}">Contato</a>
          </div>

        </nav>

        <!-- AUTH (Desktop View) -->
        <div class="auth-desktop-zone">
          {% if user.is_authenticated %}
          <div class="user-pill">
            <span class="welcome-user">Olá, <span>{{ user.username|upper }}</span></span>
            <a href="{% url 'arkanos:logout' %}" class="btn-mini btn-logout">SAIR</a>
          </div>
          {% else %}
          <div class="auth-buttons-premium">
            <a href="{% url 'arkanos:login' %}" class="btn-premium login">ENTRAR</a>
            <a href="{% url 'arkanos:cadastro' %}" class="btn-premium register">CADASTRAR</a>
          </div>
          {% endif %}
        </div>

      </div>
    </div>

    <style>
      /* 
       ARKANOS PREMIUM HEADER 
       Specificity managed with IDs to prevent leakage 
    */
      #ark-header-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 9999 !important;
      }

      #ark-site-header {
        width: 100%;
        transition: all 0.3s ease;
        background: rgba(10, 15, 28, 0.7);
        backdrop-filter: blur(10px);
      }

      #ark-site-header.header-solid,
      #ark-site-header.scrolled {
        background: #0a0f1c !important;
        backdrop-filter: blur(20px) !important;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      }

      #ark-site-header.scrolled .top-bar-mini {
        height: 0;
        overflow: hidden;
        opacity: 0;
      }

      /* MAIN BAR */
      .main-bar {
        height: 100px;
        display: flex;
        align-items: center;
        background: #0a0f1c;
        /* Solid dark bar */
        border-bottom: 2px solid rgba(241, 196, 15, 0.2);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
      }

      #ark-site-header.scrolled .main-bar {
        height: 70px;
      }

      .main-bar-inner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 1280px !important;
        margin: 0 auto !important;
        padding: 0 40px !important;
        gap: 20px;
      }

      /* LOGO */
      .logo-area {
        flex-shrink: 0;
      }

      .logo-link {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
      }

      .logo-img {
        height: 120px;
        width: 120px;
        object-fit: cover;
        object-position: 50% 10%;
        filter: drop-shadow(0 0 15px rgba(241, 196, 15, 0.4));
        transition: all 0.3s ease;
      }

      #ark-site-header.scrolled .logo-img {
        height: 70px;
        width: 70px;
      }

      .logo-img:hover {
        transform: scale(1.08) rotate(-2deg);
      }

      /* NAVIGATION */
      #ark-main-nav {
        flex-grow: 1;
        display: flex;
        justify-content: center;
      }

      .nav-list a {
        color: #f8fafc;
        text-decoration: none;
        font-weight: 800;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.2s;
        padding: 5px 12px;
        border-radius: 8px;
      }

      .nav-list a:hover {
        color: #f1c40f;
        background: rgba(241, 196, 15, 0.05);
      }

      /* Dropdown */
      .nav-item-dropdown {
        position: relative;
        padding: 10px 0;
      }

      .drop-menu {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        background: #1e293b;
        border-radius: 12px;
        padding: 16px;
        min-width: 220px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: 0.3s;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }

      .nav-item-dropdown:hover .drop-menu {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }

      .drop-section h6 {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.3);
        margin-bottom: 5px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .drop-section a {
        display: block;
        padding: 5px 0;
        font-size: 12px !important;
        text-transform: none !important;
        color: #fff !important;
      }

      /* AUTH ZONE */
      .auth-desktop-zone {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .auth-buttons-premium {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      .btn-premium {
        padding: 14px 34px;
        border-radius: 16px;
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 140px;
      }

      .btn-premium.login {
        background: transparent;
        border: 2px solid rgba(241, 196, 15, 0.5);
        color: #f1c40f;
      }

      .btn-premium.register {
        background: linear-gradient(135deg, #f1c40f 0%, #d4af37 100%);
        color: #0c1222;
        border: none;
        box-shadow: 0 4px 20px rgba(241, 196, 15, 0.4);
      }

      .btn-premium:hover {
        transform: translateY(-5px) scale(1.05);
        box-shadow: 0 10px 30px rgba(241, 196, 15, 0.5);
      }

      .btn-premium.login:hover {
        background: rgba(241, 196, 15, 0.1);
        border-color: #f1c40f;
      }

      .user-pill {
        background: rgba(15, 23, 42, 0.8);
        padding: 10px 24px;
        border-radius: 30px;
        display: flex;
        align-items: center;
        gap: 20px;
        border: 1.5px solid rgba(241, 196, 15, 0.3);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }

      .welcome-user {
        color: #fff;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.5px;
      }

      .welcome-user span {
        color: #f1c40f;
      }

      .btn-mini.btn-logout {
        color: #ef4444;
        font-weight: 950;
        font-size: 11px;
        text-decoration: none;
        padding: 6px 12px;
        background: rgba(239, 68, 68, 0.1);
        border-radius: 8px;
        transition: 0.2s;
      }

      .btn-mini.btn-logout:hover {
        background: #ef4444;
        color: #fff !important;
      }

      /* MOBILE TOGGLE */
      #ark-mobile-toggle {
        display: none;
        background: none;
        border: none;
        cursor: pointer;
      }

      #ark-mobile-toggle span {
        display: block;
        width: 22px;
        height: 2px;
        background: #fff;
        margin: 4px 0;
        transition: 0.3s;
      }

      /* RESPONSIVE RULES */
      @media (max-width: 1200px) {
        .logo-text {
          display: none;
        }

        .nav-list {
          gap: 15px;
        }
      }

      @media (max-width: 1024px) {
        .main-bar {
          height: 60px;
        }

        #ark-mobile-toggle {
          display: block;
        }

        .auth-desktop-zone {
          display: none;
        }

        #ark-main-nav {
          position: fixed;
          top: 0;
          right: -110%;
          width: 85%;
          max-width: 320px;
          height: 100vh;
          background: #0f172a;
          flex-direction: column;
          justify-content: flex-start;
          padding: 100px 40px;
          transition: 0.4s;
          box-shadow: -10px 0 50px rgba(0, 0, 0, 0.5);
          z-index: 8888;
        }

        #ark-main-nav.active {
          right: 0;
        }

        .nav-list {
          flex-direction: column;
          align-items: flex-start;
          width: 100%;
          gap: 20px;
        }

        .nav-list a,
        .drop-trigger {
          font-size: 1.2rem !important;
        }

        .drop-menu {
          position: static;
          transform: none !important;
          opacity: 1;
          visibility: visible;
          pointer-events: auto;
          background: none;
          border: none;
          box-shadow: none;
          padding-left: 20px;
          padding-top: 10px;
        }

        .auth-mobile-zone {
          display: none !important;
        }

        #ark-main-nav.active .auth-mobile-zone {
          display: flex !important;
          flex-direction: column;
          margin-top: auto;
          gap: 10px;
        }

        .btn-primary {
          background: #f1c40f;
          color: #0f172a;
          padding: 12px;
          text-align: center;
          font-weight: 800;
          border-radius: 8px;
          text-decoration: none;
        }
      }
    </style>

    <script>
      (function () {
        const header = document.getElementById('ark-site-header');
        const toggle = document.getElementById('ark-mobile-toggle');
        const nav = document.getElementById('ark-main-nav');

        window.addEventListener('scroll', () => {
          if (window.scrollY > 40) { header.classList.add('scrolled'); }
          else { header.classList.remove('scrolled'); }
        });

        if (toggle && nav) {
          toggle.addEventListener('click', () => {
            nav.classList.toggle('active');
            toggle.classList.toggle('active');
            const spans = toggle.querySelectorAll('span');
            if (toggle.classList.contains('active')) {
              spans[0].style.transform = 'rotate(-45deg) translate(-4px, 5px)';
              spans[1].style.opacity = '0';
              spans[2].style.transform = 'rotate(45deg) translate(-4px, -5px)';
            } else {
              spans[0].style.transform = 'none'; spans[1].style.opacity = '1'; spans[2].style.transform = 'none';
            }
          });
        }
      })();
    </script>
  </header>
</div>
