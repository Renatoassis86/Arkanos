<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spelling Bee | Arkanos RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fontes RPG -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-space: #0b1120;
      --gold-arkanos: #f59e0b;
      --blue-arkanos: #38bdf8;
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-space);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0, transparent 50%), 
        radial-gradient(at 98% 100%, rgba(245, 158, 11, 0.1) 0, transparent 50%),
        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-attachment: fixed;
      color: #e2e8f0;
    }
    .arkanos-font { font-family: 'Cinzel', serif; }
    .glass-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    .heart {
      animation: beat 1s infinite alternate;
    }
    @keyframes beat {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
    .neon-text-gold {
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.5);
    }
    .neon-text-blue {
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    button { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    .hidden { display: none !important; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- ÁUDIOS -->
  <audio id="musica-fundo" autoplay loop>
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_90ba1b21be.mp3" type="audio/mp3">
  </audio>
  <audio id="som-correto">
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_37a7f96df5.mp3" type="audio/mp3">
  </audio>
  <audio id="som-erro">
    <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_46a4696fb6.mp3" type="audio/mp3">
  </audio>

  <!-- TELA INICIAL / LOGIN -->
  <div class="glass-card rounded-2xl p-8 w-full max-w-md text-center border-t-4 border-yellow-500" id="tela-inicial">
    <div class="flex justify-center mb-4">
      <div class="p-4 bg-yellow-500/10 rounded-full border border-yellow-500/30">
        <span class="text-4xl">🐝</span>
      </div>
    </div>
    <h1 class="arkanos-font text-3xl font-bold bg-gradient-to-r from-yellow-400 to-amber-600 bg-clip-text text-transparent mb-2">Spelling Bee</h1>
    <p class="text-slate-400 text-sm mb-6">Trilha de Gramática — Academia Arkanos</p>

    <div class="space-y-4 mb-6">
      <input id="nome" type="text" placeholder="Nome Completo" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-yellow-500">
      <input id="login" type="text" placeholder="Nome de Usuário (ex: rassis)" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 text-white placeholder-slate-500 focus:outline-none focus:border-yellow-500">
      <select id="serie" class="w-full bg-slate-800/50 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-yellow-500">
        <option value="" class="bg-slate-900">Selecione o Ano Letivo</option>
        <option value="1ano" class="bg-slate-900">1º Ano (Fund. 1)</option>
        <option value="2ano" class="bg-slate-900">2º Ano (Fund. 1)</option>
        <option value="4ano" class="bg-slate-900">4º Ano (Fund. 1)</option>
        <option value="9ano" class="bg-slate-900">9º Ano (Fund. 2)</option>
      </select>
    </div>

    <button onclick="iniciarJogo()" class="w-full bg-gradient-to-r from-yellow-500 to-amber-600 hover:from-yellow-400 hover:to-amber-500 text-slate-900 font-bold py-3 rounded-xl shadow-lg border-t border-white/20">
      ⚔️ Iniciar Jornada
    </button>
  </div>

  <!-- TELA DE JOGO -->
  <div class="hidden glass-card rounded-3xl p-6 w-full max-w-xl text-center border-slate-800" id="tela-jogo">
    
    <!-- HEADER DO JOGO (HUD) -->
    <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
      <div class="text-left">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Pontuação</span>
        <div class="text-xl font-bold text-yellow-500 neon-text-gold" id="pontos">0000</div>
      </div>
      <div>
        <span class="text-slate-400 text-xs uppercase tracking-wider">Combo</span>
        <div class="text-lg font-bold text-sky-400" id="streak">🔥 0</div>
      </div>
      <div class="text-right">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Dificuldade</span>
        <div class="text-sm font-bold uppercase" id="dificuldade-hud">Fácil</div>
      </div>
    </div>

    <!-- VIDAS E TEMPO -->
    <div class="flex justify-between items-center mb-6">
      <div class="flex gap-1" id="vidas-container">
        <span class="heart text-red-500 text-xl">❤️</span>
        <span class="heart text-red-500 text-xl">❤️</span>
        <span class="heart text-red-500 text-xl">❤️</span>
      </div>
      <div class="bg-slate-800/80 px-3 py-1 rounded-full text-xs font-mono border border-slate-700">
        ⏳ <span id="contador" class="text-white font-bold">45</span>s
      </div>
    </div>

    <!-- AVATAR LYRA -->
    <div class="mb-6">
      <div class="inline-block relative">
        <img src="https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=150&q=80" class="w-20 h-20 rounded-full border-2 border-yellow-500 p-0.5 shadow-lg object-cover">
        <span class="absolute -bottom-1 -right-1 bg-yellow-500 text-slate-900 text-2xs font-bold px-1.5 py-0.5 rounded">Lyra</span>
      </div>
      <p id="pergunta" class="text-slate-300 text-sm px-4 mt-2 italic">"Olá jogador, ouça a palavra e soletre com precisão."</p>
    </div>

    <!-- BOTÕES DE COMANDO -->
    <div class="grid grid-cols-1 gap-2 mb-6">
      <button onclick="ouvirPergunta()" id="btn-ouvir" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-blue-600 to-indigo-700 hover:from-blue-500 hover:to-indigo-600 text-white font-bold py-3 rounded-xl border-t border-white/10 shadow-lg">
        🔊 Ouvir Palavra <span id="repeticao-cont" class="bg-blue-900/50 px-2 py-0.5 rounded text-xs">3/3</span>
      </button>

      <div class="grid grid-cols-2 gap-2">
        <button onclick="falarFrase()" class="flex items-center justify-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm py-2 rounded-xl border border-slate-700">
          📘 Exemplo
        </button>
        <button onclick="falarSignificado()" class="flex items-center justify-center gap-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm py-2 rounded-xl border border-slate-700">
          📖 Significado
        </button>
      </div>
    </div>

    <!-- RESPOSTA -->
    <button onclick="gravarResposta()" id="btn-responder" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-900/20 border-t border-emerald-400/20 text-lg flex items-center justify-center gap-2 animate-pulse">
      🎤 Ditar Resposta
    </button>

    <div id="resultado" class="mt-4 text-center font-bold text-lg min-h-[28px]"></div>

  </div>

  <!-- TELA RANKING -->
  <div id="tela-ranking" class="hidden glass-card rounded-2xl p-8 w-full max-w-md text-center">
    <h2 class="arkanos-font text-2xl font-bold text-yellow-400 mb-4">🏆 Fim da Linha</h2>
    <p id="ranking-msg" class="text-slate-300 mb-4"></p>
    <button onclick="reiniciarJogo()" class="bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold py-2 px-6 rounded-xl">🔁 Tentar de Novo</button>
  </div>

  <!-- JS -->
  <script>
    // Banco Estático como Fallback (enquanto o fetch não está pronto)
    const bancoPalavras = {
      "1ano": {
        "facil": [{ word: "cat", meaning: "Animal que faz miau.", frase: "The cat is on the mat." }],
        "medio": [{ word: "dog", meaning: "Animal que late.", frase: "I love my dog." }],
        "dificil": [{ word: "bird", meaning: "Animal que voa.", frase: "The bird sings." }]
      },
      "2ano": {
        "facil": [{ word: "apple", meaning: "Uma fruta doce.", frase: "I eat an apple." }],
        "medio": [{ word: "banana", meaning: "Fruta amarela.", frase: "Monkeys eat bananas." }],
        "dificil": [{ word: "chicken", meaning: "Frango.", frase: "Chicken is for dinner." }]
      },
      "4ano": {
        "facil": [{ word: "about", meaning: "Sobre algo.", frase: "We talk about games." }],
        "medio": [{ word: "accident", meaning: "Algo inesperado.", frase: "Drive carefully." }],
        "dificil": [{ word: "beautiful", meaning: "Muito bonito.", frase: "You are beautiful." }]
      }
    };

    let jogador = {};
    let palavraAtual = {};
    let pontos = 0;
    let combo = 0;
    let vidas = 3;
    let repeticoesRestantes = 3;
    let nivelAtual = 'facil'; 
    let cronometro;

    function iniciarJogo() {
      const nome = document.getElementById("nome").value.trim();
      const login = document.getElementById("login").value.trim();
      const serie = document.getElementById("serie").value;

      if (!nome || !login || !serie) return alert("Por favor, preencha todos os campos.");

      jogador = { nome, login, serie };
      document.getElementById("tela-inicial").classList.add("hidden");
      document.getElementById("tela-jogo").classList.remove("hidden");
      proximaPalavra();
    }

    function proximaPalavra() {
      // Ajusta dificuldade baseado no combo (Streak)
      if (combo >= 5) nivelAtual = 'dificil';
      else if (combo >= 2) nivelAtual = 'medio';
      else nivelAtual = 'facil';

      document.getElementById("dificuldade-hud").innerText = nivelAtual.charAt(0).toUpperCase() + nivelAtual.slice(1);
      
      const serieDados = bancoPalavras[jogador.serie] || bancoPalavras["2ano"];
      const lista = serieDados[nivelAtual] || serieDados["facil"];
      
      palavraAtual = lista[Math.floor(Math.random() * lista.length)];

      repeticoesRestantes = 3;
      document.getElementById("repeticao-cont").innerText = "3/3";
      document.getElementById("btn-ouvir").disabled = false;
      document.getElementById("btn-ouvir").classList.remove("opacity-50");
      document.getElementById("resultado").innerText = "";

      document.getElementById("pergunta").innerText = `"Me soletre a palavra..."`;
      iniciarContador(45);
      ouvirPergunta();
    }

    function ouvirPergunta() {
      if (repeticoesRestantes <= 0) return;

      const utterance = new SpeechSynthesisUtterance(palavraAtual.word);
      utterance.lang = 'en-US';
      utterance.rate = 0.65; // Um pouco mais lento para ficar claro
      speechSynthesis.speak(utterance);

      repeticoesRestantes--;
      document.getElementById("repeticao-cont").innerText = `${repeticoesRestantes}/3`;

      if (repeticoesRestantes <= 0) {
        document.getElementById("btn-ouvir").disabled = true;
        document.getElementById("btn-ouvir").classList.add("opacity-50");
      }
    }

    function falarFrase() {
      const utterance = new SpeechSynthesisUtterance(palavraAtual.frase);
      utterance.lang = 'en-US';
      speechSynthesis.speak(utterance);
    }

    function falarSignificado() {
      const utterance = new SpeechSynthesisUtterance(palavraAtual.meaning);
      // Mantemos PT-BR se o significado for em português ou EN se for em inglês
      utterance.lang = 'pt-BR'; 
      speechSynthesis.speak(utterance);
    }

    function gravarResposta() {
      clearInterval(cronometro);
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        alert("Seu navegador não suporta reconhecimento de voz. Tente o Google Chrome.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.start();

      document.getElementById("btn-responder").innerText = "🎤 Ouvindo...";

      recognition.onresult = (event) => {
        const resposta = event.results[0][0].transcript.toLowerCase().replace(/[^a-z]/g, '');
        executarValidacao(resposta);
      };

      recognition.onerror = () => {
        document.getElementById("btn-responder").innerText = "🎤 Ditar Resposta";
        alert("Não consegui ouvir. Tente novamente.");
        iniciarContador(15); // Dá mais uns segundos
      };
    }

    function executarValidacao(resposta) {
      document.getElementById("btn-responder").innerText = "🎤 Ditar Resposta";
      const correta = palavraAtual.word.toLowerCase();

      if (resposta === correta) {
        pontos += (nivelAtual === 'dificil' ? 300 : nivelAtual === 'medio' ? 200 : 100);
        combo++;
        document.getElementById("som-correto").play();
        document.getElementById("resultado").innerText = "✅ Correto! +XP";
        document.getElementById("resultado").className = "text-emerald-400 mt-4 font-bold text-center";
      } else {
        combo = 0; 
        vidas--;
        document.getElementById("som-erro").play();
        atualizarHUDVidas();
        document.getElementById("resultado").innerText = `❌ Incorreto! Era ${correta.toUpperCase()}`;
        document.getElementById("resultado").className = "text-red-400 mt-4 font-bold text-center";
      }

      document.getElementById("pontos").innerText = String(pontos).padStart(4, '0');
      document.getElementById("streak").innerText = `🔥 ${combo}`;

      if (vidas <= 0) {
         setTimeout(() => gameOver(), 1500);
      } else {
         setTimeout(proximaPalavra, 2500);
      }
    }

    function atualizarHUDVidas() {
      const container = document.getElementById("vidas-container");
      container.innerHTML = "💔 ".repeat(3 - vidas) + "❤️ ".repeat(vidas);
    }

    function iniciarContador(tempo) {
      clearInterval(cronometro);
      document.getElementById("contador").innerText = tempo;
      cronometro = setInterval(() => {
        tempo--;
        document.getElementById("contador").innerText = tempo;
        if (tempo <= 0) {
          clearInterval(cronometro);
          executarValidacao(""); // Erro por falta de tempo
        }
      }, 1000);
    }

    function gameOver() {
      document.getElementById("tela-jogo").classList.add("hidden");
      document.getElementById("tela-ranking").classList.remove("hidden");
      document.getElementById("ranking-msg").innerText = `Seu score final foi de ${pontos} pontos! Você atingiu um combo de 🔥 ${combo}.`;
    }

    function reiniciarJogo() {
      location.reload();
    }

    window.addEventListener("click", () => {
      const musica = document.getElementById("musica-fundo");
      if (musica.paused) {
        musica.volume = 0.1;
        musica.play().catch(() => {});
      }
    }, { once: true });

  </script>
</body>
</html>
